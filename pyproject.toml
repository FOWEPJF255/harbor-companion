[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-companion"
version = "0.2.0"
description = "An inspectable companion agent prototype with consent-based memory and bounded tools"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1", "pydantic==2.13.5", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-data]
harbor = ["skills/*.md"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
